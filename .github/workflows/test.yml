name: Test

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:check
      - run: npm run format:check

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test:types
      - run: npm run test:cov
      - name: Upload coverage summary
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.node-version == '24.x' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 1

  coverage-badge:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize pushes to gh-pages.
    concurrency:
      group: coverage-badge
      cancel-in-progress: false

    steps:
      # Badge script is taken from the tested commit; the gh-pages branch is checked out separately.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
      - uses: actions/download-artifact@v4
        with:
          name: coverage-summary
          path: coverage
      - name: Render badge
        run: |
          mkdir -p gh-pages/badges
          node .github/scripts/coverage-badge.mjs coverage/coverage-summary.json gh-pages/badges/coverage.svg
      - name: Push badge to gh-pages
        working-directory: gh-pages
        run: |
          if git diff --quiet -- badges/coverage.svg && ! git ls-files --others --exclude-standard | grep -q .; then
            echo "Badge is up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add badges/coverage.svg
          git commit -m 'Update badges [skip ci]'
          git push origin HEAD:gh-pages
